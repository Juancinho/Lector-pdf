name: MJ Study Android
on:
  push:
    branches: [main, 'study/**']
  pull_request:
  workflow_dispatch:
    inputs:
      pdfium:
        description: PDFium build (prebuilt omits upstream Arabic patches)
        type: choice
        options: [prebuilt, from-source]
        default: prebuilt
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reuse development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mj-study-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Install native build tools
        run: python -m pip install requests cmake ninja
      - name: Cache pinned native build
        uses: actions/cache@v4
        with:
          path: |
            PdfiumAndroid/src/main/jni/lib
            PdfiumAndroid/src/main/libs
          key: native-arm64-ndk29-${{ inputs.pdfium || 'prebuilt' }}-${{ hashFiles('build_dependencies/**', 'build_dependencies.py', 'PdfiumAndroid/src/main/jni/**') }}
      - name: Build native dependencies and JNI
        env:
          PDFIUM_MODE: ${{ inputs.pdfium || 'prebuilt' }}
        run: ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865" python build_dependencies.py --pdfium "$PDFIUM_MODE" --abi arm64-v8a
      - name: Verify native runtime exists
        run: |
          for name in libjniPdfium.so libmodpdfium.so libmodft2.so libmodpng.so libc++_shared.so; do
            test -s "PdfiumAndroid/src/main/libs/arm64-v8a/$name"
          done
      - name: Unit tests, lint and APKs
        run: ./gradlew :app:testDebugUnitTest :AndroidPdfViewer:android-pdf-viewer:testDebugUnitTest :PdfiumAndroid:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-study-test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mj-study-arm64-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  integration:
    name: Native PDF and pen input (API 30)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tools and test image
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' emulator 'system-images;android-30;default;x86_64'
          python -m pip install requests cmake ninja
      - uses: actions/cache@v4
        with:
          path: |
            PdfiumAndroid/src/main/jni/lib
            PdfiumAndroid/src/main/libs
          key: native-x86_64-ndk29-${{ hashFiles('build_dependencies/**', 'build_dependencies.py', 'PdfiumAndroid/src/main/jni/**') }}
      - name: Build native x86_64 runtime
        run: ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865" python build_dependencies.py --pdfium prebuilt --abi x86_64
      - name: Boot accelerated Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd -n study-ci -k 'system-images;android-30;default;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd study-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Test highlight and ink create-save-reopen, UI and input
        run: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.gitlab.mudlej.MjPdfReader.study --max-workers=2 --console=plain
      - name: Collect emulator diagnostics
        if: always()
        run: adb logcat -d > logcat.txt || true
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mj-study-android-integration
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            logcat.txt
