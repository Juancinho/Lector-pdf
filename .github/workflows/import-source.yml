name: Import MJ Study source history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned upstream and reviewed Study commits
        env:
          STUDY_BUNDLE: ''
        run: |
          set -euo pipefail
          printf '%s' "$STUDY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/mj-study.bundle"
          echo '540bf6b9dc381ff300bbdff9324a58e2a013149d71c70cf3885274be9b36811d  '"$RUNNER_TEMP/mj-study.bundle" | sha256sum --check
          git fetch --no-tags https://gitlab.com/mudlej_android/mj_pdf_reader.git 286277c6a85a4068cbbfbd18c93a742f0b2087ed
          git bundle verify "$RUNNER_TEMP/mj-study.bundle"
          git fetch "$RUNNER_TEMP/mj-study.bundle" refs/heads/study/custom-highlights:refs/heads/study/custom-highlights
          test "$(git rev-parse study/custom-highlights)" = '1942e2c7c7af93bf5e830d2b66a95c8d7caaa125'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          imported=$(git rev-parse study/custom-highlights)
          tree=$(git rev-parse "$imported^{tree}")
          merge=$(printf 'Import MJ Study with upstream history and verified development commits\n' | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$imported")
          git push origin "$merge:refs/heads/main" study/custom-highlights:refs/heads/study/custom-highlights
          echo "Imported source commit $imported" >> "$GITHUB_STEP_SUMMARY"
