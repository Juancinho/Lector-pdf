apply plugin: 'com.android.library'

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
    }
    namespace = 'com.github.barteksc.pdfviewer'

}

configurations { mockitoAgent }

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core:1.18.0'
    implementation project(path: ':PdfiumAndroid')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
}

// Explicit Java 21 instrumentation avoids Mockito's process self-attachment.
abstract class MockitoAgentArguments implements CommandLineArgumentProvider {
    @Classpath
    abstract ConfigurableFileCollection getAgentClasspath()

    @Override
    Iterable<String> asArguments() {
        return ["-javaagent:${agentClasspath.singleFile.absolutePath}"]
    }
}
tasks.withType(Test).configureEach {
    def agentArguments = objects.newInstance(MockitoAgentArguments)
    agentArguments.agentClasspath.from(configurations.mockitoAgent)
    jvmArgumentProviders.add(agentArguments)
}
